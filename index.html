<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PocketPe — Intent-Based Money Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Desktop Presentation Environment -->
  <div id="desktop-wrapper">
    <!-- Top Demo Controls (Desktop view only) -->
    <div class="desktop-banner">
      <span class="pill">Prototype MVP</span>
      <span>PocketPe — «Every rupee has a purpose.»</span>
      <button id="btn-toggle-viewport-mode">Toggle Frame View</button>
    </div>

    <!-- Phone Shell Simulation -->
    <div id="phone-shell">
      <!-- Status Bar with Native Notch -->
      <div class="phone-status-bar">
        <span id="status-clock">9:41</span>
        <div class="phone-notch">
          <div class="phone-notch-camera"></div>
        </div>
        <div class="status-right">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"/>
          </svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0 0 12 4z"/>
          </svg>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
            <rect x="2" y="6" width="18" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="4" y="8" width="11" height="8" rx="1.5"/>
            <path d="M22 10v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <!-- Main Scrollable App Container -->
      <div id="app-screen-container">
        <div id="screen-home" class="screen-page active"></div>
        <div id="screen-wallets" class="screen-page"></div>
        <div id="screen-pay" class="screen-page"></div>
        <div id="screen-split" class="screen-page"></div>
        <div id="screen-activity" class="screen-page"></div>
        <div id="screen-profile" class="screen-page"></div>
      </div>

      <!-- Bottom Navigation Bar (5 Items) -->
      <nav id="bottom-nav">
        <button class="nav-item active" data-target="home" id="nav-home">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span class="nav-label">Home</span>
        </button>

        <button class="nav-item" data-target="wallets" id="nav-wallets">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <rect width="20" height="14" x="2" y="5" rx="2"></rect>
            <line x1="2" x2="22" y1="10" y2="10"></line>
          </svg>
          <span class="nav-label">Wallets</span>
        </button>

        <button class="nav-item nav-pay" data-target="pay" id="nav-pay">
          <div class="nav-pay-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <rect width="5" height="5" x="3" y="3" rx="1"></rect>
              <rect width="5" height="5" x="16" y="3" rx="1"></rect>
              <rect width="5" height="5" x="3" y="16" rx="1"></rect>
              <path d="M21 16h-3a2 2 0 0 0-2 2v3"></path>
              <path d="M21 21v.01"></path>
              <path d="M12 7v3a2 2 0 0 1-2 2H7"></path>
              <path d="M3 12h.01"></path>
              <path d="M12 3h.01"></path>
              <path d="M12 16v.01"></path>
              <path d="M16 12h1"></path>
              <path d="M21 12v.01"></path>
              <path d="M12 21v-1"></path>
            </svg>
          </div>
          <span class="nav-label" style="margin-top: -4px;">Pay</span>
        </button>

        <button class="nav-item" data-target="activity" id="nav-activity">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
          <span class="nav-label">Activity</span>
        </button>

        <button class="nav-item" data-target="profile" id="nav-profile">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span class="nav-label">Profile</span>
        </button>
      </nav>

      <!-- App Modals -->
      <div id="modal-receive-money" class="modal-backdrop">
        <div class="modal-sheet" id="receive-money-modal-content"></div>
      </div>

      <div id="modal-move-money" class="modal-backdrop">
        <div class="modal-sheet" id="move-money-modal-content"></div>
      </div>

      <div id="modal-create-wallet" class="modal-backdrop">
        <div class="modal-sheet" id="create-wallet-modal-content"></div>
      </div>

      <div id="modal-onboarding" class="modal-backdrop">
        <div class="modal-sheet" id="onboarding-modal-content"></div>
      </div>

      <!-- Toast Feedback Notifications -->
      <div id="toast-container"></div>

      <!-- Confetti Cannon Canvas -->
      <canvas id="confetti-canvas"></canvas>
    </div>
  </div>

  <!-- Application Bootstrap -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
